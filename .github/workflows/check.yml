name: Check Chinese tutorial

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build without downloading dependencies
        run: node scripts/build.mjs
      - name: Check local links and original code coverage
        run: python3 scripts/check.py
      - name: Ensure generated pages match their sources
        run: git diff --exit-code -- docs
